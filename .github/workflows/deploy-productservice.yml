name: Deploy Product Service

on:
  workflow_run:
    workflows:
      - Backend Tests
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ecommerce-microservices/product-service

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies For Testing
        run: npm install

      - name: Run Tests
        run: npm test

      - name: Clean Existing Modules
        run: rm -rf node_modules

      - name: Install Production Dependencies
        run: npm ci --omit=dev

      - name: Create Deployment Package
        run: |
          zip -r productservice.zip . \
            -x "*.git*" \
            -x "*.test.js" \
            -x "coverage/*" \
            -x ".github/*"

      - name: Verify ZIP Contents
        run: |
          unzip -l productservice.zip | head -100

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy Lambda
        run: |
          aws lambda update-function-code \
            --function-name productservice \
            --zip-file fileb://productservice.zip

      - name: Wait For Deployment
        run: |
          aws lambda wait function-updated \
            --function-name productservice

      - name: Verify Deployment
        run: |
          aws lambda get-function \
            --function-name productservice